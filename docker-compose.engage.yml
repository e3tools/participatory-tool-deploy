    build:
      context: ~/systems/engage-frontend/
      dockerfile: deploy/Dockerfile
      args:
        EXPO_PUBLIC_FRAPPE_URL_WEB: "http://localhost:${MAKUENI_BACKEND_PORT}"
    image: ${DOCKERHUB_USER}/engage-frontend:${VERSION}
    environment:
      # Tells Nginx which internal service and port to target
      BACKEND_HOST: ${MAKUENI_SITE_NAME}
      BACKEND_PORT: "${MAKUENI_BACKEND_PORT}"
      EXPO_PUBLIC_FRAPPE_URL_WEB: "http://localhost:${MAKUENI_BACKEND_PORT}"
    restart: unless-stopped
    networks:
      - app-network 

  # Edge Reverse Proxy
  edge-proxy:
    image: nginx:alpine
    ports:
      # - "${NYERI_FRONTEND_PORT}:3000"
      # - "${MURANGA_FRONTEND_PORT}:3001"
      # - "${NYERI_BACKEND_PORT}:8081"
      # - "${MURANGA_BACKEND_PORT}:8082"
      # - "8083:8083"
      - "${NYERI_FRONTEND_PORT}:3000"
      - "${MURANGA_FRONTEND_PORT}:3001"

      - "${NYERI_BACKEND_PORT}:${NYERI_BACKEND_PORT}"
      - "${MURANGA_BACKEND_PORT}:${MURANGA_BACKEND_PORT}"
      - "${TAITA_BACKEND_PORT}:${TAITA_BACKEND_PORT}"
      - "${NANDI_BACKEND_PORT}:${NANDI_BACKEND_PORT}"
      - "${HOMABAY_BACKEND_PORT}:${HOMABAY_BACKEND_PORT}"
      - "${VIHIGA_BACKEND_PORT}:${VIHIGA_BACKEND_PORT}"
      - "${MAKUENI_BACKEND_PORT}:${MAKUENI_BACKEND_PORT}"
    volumes:
      - ./edge-proxy/nginx.engage.conf:/etc/nginx/nginx.conf:ro
      # MOUNT SITES DATA VOLUME TO NGINX FOR STATIC ASSETS. Read-only is FINE for Nginx edge proxy
      - sites-data:/home/frappe/frappe-bench/sites:ro
      - apps:/home/frappe/frappe-bench/apps:ro
    depends_on:
      - frappe
      # - nyeri-react
      # - muranga-react
      - nyeri-engage-app
      - muranga-engage-app
      - taita-engage-app
      - nandi-engage-app
      - homabay-engage-app
      - makueni-engage-app
      - vihiga-engage-app
    networks:
      - app-network

volumes:
  db-data:
  sites-data:
  apps:

networks:
  app-network:
    driver: bridge
