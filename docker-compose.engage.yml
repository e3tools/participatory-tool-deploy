  # # Homabay Engage App
  homabay-engage-app:
    pull_policy: never
    build:
      context: ~/systems/engage-frontend/
      dockerfile: deploy/Dockerfile
      args:
        EXPO_PUBLIC_FRAPPE_URL_WEB: "http://localhost:${HOMABAY_BACKEND_PORT}"
    image: ${DOCKERHUB_USER}/engage-frontend:${VERSION}
    environment:
