      context: ~/systems/nairobi-pmts/
      dockerfile: deploy/Dockerfile
      args:
        VITE_FRAPPE_BACKEND_URL: "http://localhost"
        VITE_FRAPPE_BACKEND_PORT: "${TAITA_BACKEND_PORT}"
        VITE_FRAPPE_BACKEND_SUBDOMAIN: ""
        # VITE_FRAPPE_BACKEND_SUBDOMAIN: "/backend"
        VITE_FRAPPE_SITE: "${TAITA_SITE_NAME}"
    environment:
      # Tells Nginx which internal service and port to target
      BACKEND_HOST: ${TAITA_SITE_NAME}
      BACKEND_PORT: "${TAITA_BACKEND_PORT}"
    restart: unless-stopped
    networks:
      - app-network

  # Vihiga React Frontend
  vihiga-react:
    pull_policy: never
    build:
      context: ~/systems/nairobi-pmts/
      dockerfile: deploy/Dockerfile
      args:
        VITE_FRAPPE_BACKEND_URL: "http://localhost"
        VITE_FRAPPE_BACKEND_PORT: "${VIHIGA_BACKEND_PORT}"
        VITE_FRAPPE_BACKEND_SUBDOMAIN: ""
        # VITE_FRAPPE_BACKEND_SUBDOMAIN: "/backend"
        VITE_FRAPPE_SITE: "${VIHIGA_SITE_NAME}"
    environment:
      # Tells Nginx which internal service and port to target
