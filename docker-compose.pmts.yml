  # Homabay React Frontend
  homabay-react:
    pull_policy: never
    build:
      context: ~/systems/nairobi-pmts/
      dockerfile: deploy/Dockerfile
      args:
        VITE_FRAPPE_BACKEND_URL: "http://localhost"
        VITE_FRAPPE_BACKEND_PORT: "${HOMABAY_BACKEND_PORT}"
        VITE_FRAPPE_BACKEND_SUBDOMAIN: ""
        # VITE_FRAPPE_BACKEND_SUBDOMAIN: "/backend"
        VITE_FRAPPE_SITE: "${HOMABAY_SITE_NAME}"
    environment:
      # Tells Nginx which internal service and port to target
