version: "3.8"

name: ${PIMTS_PROJECT_NAME}

services:
  # Database
  db:
    image: mariadb:10.6
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-allowed-packet=512M
      - --innodb-file-per-table=1
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - app-network

  # Redis Caching & Queue
  redis-cache:
    image: redis:7-alpine
    networks:
      - app-network

  redis-queue:
    image: redis:7-alpine
    networks:
      - app-network

  # Single Multi-Tenant Frappe Backend Container
  frappe:
    build:
      context: ./frappe
      dockerfile: Dockerfile.pmts
    env_file:
      - .env
    volumes:
      - sites-data:/home/frappe/frappe-bench/sites
      - apps:/home/frappe/frappe-bench/apps
    depends_on:
      - db
      - redis-cache
      - redis-queue
    networks:
      - app-network

  # Nyeri React Frontend
  # nyeri-react:
  #   build:
  #     context: ./react-demo-app
  #     dockerfile: ../nyeri-react/Dockerfile
  #   networks:
  #     - app-network

  # Nyeri React Frontend
  nyeri-react:
    pull_policy: never
    build:
      context: ~/systems/nairobi-pmts/
      dockerfile: deploy/Dockerfile
      args:
        VITE_FRAPPE_BACKEND_URL: "http://localhost"
        VITE_FRAPPE_BACKEND_PORT: "${NYERI_BACKEND_PORT}"
        VITE_FRAPPE_BACKEND_SUBDOMAIN: ""
        # VITE_FRAPPE_BACKEND_SUBDOMAIN: "/backend"
        VITE_FRAPPE_SITE: "${NYERI_SITE_NAME}"
    environment:
      # Tells Nginx which internal service and port to target
      BACKEND_HOST: ${NYERI_SITE_NAME}
      BACKEND_PORT: "${NYERI_BACKEND_PORT}"
    restart: unless-stopped
    networks:
      - app-network

  # Muranga React Frontend
  muranga-react:
    pull_policy: never
    build:
      context: ~/systems/nairobi-pmts/
      dockerfile: deploy/Dockerfile
      args:
        VITE_FRAPPE_BACKEND_URL: "http://localhost"
        VITE_FRAPPE_BACKEND_PORT: "${MURANGA_BACKEND_PORT}"
        VITE_FRAPPE_BACKEND_SUBDOMAIN: ""
        # VITE_FRAPPE_BACKEND_SUBDOMAIN: "/backend"
        VITE_FRAPPE_SITE: "${MURANGA_SITE_NAME}"
    environment:
      # Tells Nginx which internal service and port to target
      BACKEND_HOST: ${MURANGA_SITE_NAME}
      BACKEND_PORT: "${MURANGA_BACKEND_PORT}"
    restart: unless-stopped
    networks:
      - app-network

  # Taita React Frontend
  taita-react:
    pull_policy: never
