    networks:
      - app-network
    
  # # # Nyeri Engage App
  # nyeri-engage-app:
  #   pull_policy: never
  #   build:
  #     context: ~/systems/engage-frontend/
  #     dockerfile: deploy/Dockerfile
  #     args:
  #       EXPO_PUBLIC_FRAPPE_URL_WEB: "http://localhost:${NYERI_BACKEND_PORT}"
  #   environment:
  #     # Tells Nginx which internal service and port to target
  #     BACKEND_HOST: ${NYERI_SITE_NAME}
  #     BACKEND_PORT: "${NYERI_BACKEND_PORT}"
  #     EXPO_PUBLIC_FRAPPE_URL_WEB: "http://localhost:${NYERI_BACKEND_PORT}"
  #   restart: unless-stopped
  #   networks:
  #     - app-network 

  # Edge Reverse Proxy
  edge-proxy:
    image: nginx:alpine
    ports:
      - "${NYERI_FRONTEND_PORT}:${NYERI_FRONTEND_PORT}"
      - "${TAITA_FRONTEND_PORT}:${TAITA_FRONTEND_PORT}"
      - "${MURANGA_FRONTEND_PORT}:${MURANGA_FRONTEND_PORT}"
      - "${VIHIGA_FRONTEND_PORT}:${VIHIGA_FRONTEND_PORT}"
      - "${NANDI_FRONTEND_PORT}:${NANDI_FRONTEND_PORT"
      - "${HOMABAY_FRONTEND_PORT}:${HOMABAY_FRONTEND_PORT}"
      - "${MAKUENI_FRONTEND_PORT}:${MAKUENI_FRONTEND_PORT}"

      - "${NYERI_BACKEND_PORT}:${NYERI_BACKEND_PORT}"
      - "${TAITA_BACKEND_PORT}:${TAITA_BACKEND_PORT}"
      - "${MURANGA_BACKEND_PORT}:${MURANGA_BACKEND_PORT}"
      - "${VIHIGA_BACKEND_PORT}:${VIHIGA_BACKEND_PORT}"
      - "${NANDI_BACKEND_PORT}:${NANDI_BACKEND_PORT}"
      - "${HOMABAY_BACKEND_PORT}:${HOMABAY_BACKEND_PORT}"
      - "${MAKUENI_BACKEND_PORT}:${MAKUENI_BACKEND_PORT}"
      # - "8083:8083"
    volumes:
      - ./edge-nginx/nginx.pmts.conf:/etc/nginx/nginx.conf:ro
      # MOUNT SITES DATA VOLUME TO NGINX FOR STATIC ASSETS. Read-only is FINE for Nginx edge proxy
      - sites-data:/home/frappe/frappe-bench/sites:ro
      - apps:/home/frappe/frappe-bench/apps:ro
    depends_on:
      - frappe
      - nyeri-react
      - taita-react
      - muranga-react
      - vihiga-react
      - nandi-react
      - homabay-react
      - makueni-react
      # - nyeri-engage-app
    networks:
      - app-network

volumes:
  db-data:
  sites-data:
  apps:

networks:
  app-network:
    driver: bridge
