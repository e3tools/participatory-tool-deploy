worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Added at the top level so Nginx serves JS/CSS files with correct Content-Type headers (text/css, application/javascript), preventing browser MIME-type blockin
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    upstream nyeri_frontend {
        server nyeri-react:80;
    }

    upstream muranga_frontend {
        server muranga-react:80;
    }

    upstream frappe_backend {
        server frappe:8000;
    }

    server {
        listen 8081;
        server_name _;

        client_max_body_size 100M;

        ###########################################################
        # React Assets
        ###########################################################
        location /static/ {
            proxy_pass http://nyeri_frontend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        ###########################################################
        # Frappe Static Assets (Served directly from mounted volume)
        ###########################################################
        location /assets/ {
            # Nginx serves JavaScript and CSS straight out of the shared Docker volume without calling Python/Gunicorn
            alias /home/frappe/frappe-bench/sites/assets/;
            try_files $uri $uri/ =404;
            expires 7d;
            add_header Cache-Control "public, no-transform";
        } 

        ###########################################################
        # Public Uploaded Files (Served directly from mounted volume)
        ###########################################################
        location /files/ {
            alias /home/frappe/frappe-bench/sites/nyeri.site/public/files/;
            try_files $uri $uri/ =404;
        }

        ###########################################################
        # API Routes
        ###########################################################
        location /api/ {
            proxy_pass http://frappe_backend;

            proxy_set_header Host nyeri.site;
            proxy_set_header X-Frappe-Site-Name nyeri.site;
            proxy_set_header X-Forwarded-Host $host;
            # X-Forwarded-Port 8081 added as it ensures Frappe knows it is running behind port 8081 and generates redirect links (e.g., login redirects) correctly
            proxy_set_header X-Forwarded-Port 8081;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            
            # Disable X-Accel-Redirect since edge-proxy handles files directly
            # Gunicorn doesn't try to hand off file serving back to Nginx using internal header redirects
            proxy_set_header X-Use-X-Accel-Redirect False;

            # Pass session cookie explicitly
            proxy_set_header Cookie $http_cookie;
        }

        ###########################################################
        # Frappe Desk / App Routes
        ###########################################################
        location ~ ^/(app|desk|login|logout|oauth|printview|backups) {
            proxy_pass http://frappe_backend;

            proxy_set_header Host nyeri.site;
            proxy_set_header X-Frappe-Site-Name nyeri.site;
            proxy_set_header X-Forwarded-Host $host;
            # X-Forwarded-Port 8081 added as it ensures Frappe knows it is running behind port 8081 and generates redirect links (e.g., login redirects) correctly
            proxy_set_header X-Forwarded-Port 8081;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;

            # Disable X-Accel-Redirect since edge-proxy handles files directly
            # Gunicorn doesn't try to hand off file serving back to Nginx using internal header redirects
            proxy_set_header X-Use-X-Accel-Redirect False;

            # Pass session cookie explicitly
            proxy_set_header Cookie $http_cookie;
        }

        ###########################################################
        # Private Files (Proxied to Gunicorn for permission check)
        ###########################################################
        location /private/ {
            proxy_pass http://frappe_backend;

            proxy_set_header Host nyeri.site;
            proxy_set_header X-Frappe-Site-Name nyeri.site;
            proxy_set_header X-Forwarded-Port 8081;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
        }

        ###########################################################
        # Socket.IO (Realtime Websockets)
        ###########################################################
        location /socket.io {
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host nyeri.site;
            proxy_set_header X-Frappe-Site-Name nyeri.site;

            proxy_pass http://frappe_backend;
        }

        ###########################################################
        # Default -> React SPA
        ###########################################################
        location / {
            proxy_pass http://nyeri_frontend;

            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

