            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Handle /mobile/ and every nested Expo route
        location ^~ /mobile/ {
            # The trailing slash strips /mobile/ before proxying.
            proxy_pass http://makueni_engage_app/;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }

        # # Route all /mobile/* requests cleanly to the Expo app container
        # location /mobile { 
        #     proxy_pass http://makueni_engage_app;

        #     proxy_http_version 1.1;

        #     proxy_set_header Upgrade $http_upgrade;
        #     proxy_set_header Connection "upgrade";

        #     proxy_set_header Host $host;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Real-IP $remote_addr;
        # }

        # # Handle Expo bundle static assets served under /mobile/_expo/
        # location ^~ /mobile/_expo/ {
        #     proxy_pass http://makueni_engage_app;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        # }

        
        ###########################################################
        # 1. EXPLICIT ROUTE FOR EXPO STATIC ASSETS & JS BUNDLES
        # Ensures all Expo static bundles, CSS modules, and web assets hit the Expo web container directly
        # Matches /_expo/static/css/..., /_expo/static/js/..., etc.
        ###########################################################
        location ^~ /_expo/ {
            proxy_pass http://makueni_engage_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
                        
        ###########################################################
        # Default -> React SPA
        ###########################################################
        location / {
            # proxy_pass http://makueni_frontend;
            proxy_pass http://makueni_engage_app/;

            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}