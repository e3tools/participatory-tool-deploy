worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Added at the top level so Nginx serves JS/CSS files with correct Content-Type headers (text/css, application/javascript), preventing browser MIME-type blockin
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # REACT Frontends
    # upstream nyeri_frontend {
    #     server nyeri-react:80;
    # }

    # Nyeri EXPO Frontend
    upstream nyeri_engage_app {
        server nyeri-engage-app:80;
    }

    # Taita EXPO Frontend
    upstream taita_engage_app {
        server taita-engage-app:80;
    }

    # Muranga EXPO Frontend
    upstream muranga_engage_app {
        server muranga-engage-app:80;
    }

    # Vihiga EXPO Frontend
    upstream vihiga_engage_app {
        server vihiga-engage-app:80;
    }

    # HomaBay EXPO Frontend
    upstream homabay_engage_app {
        server homabay-engage-app:80;
    }

    # Nandi EXPO Frontend
    upstream nandi_engage_app {
        server nandi-engage-app:80;
    }

    # Makueni EXPO Frontend
    upstream makueni_engage_app {
        server makueni-engage-app:80;
    }

    # Single Frappe Backend
    upstream frappe_backend {
        server frappe:8000;
    }

    # Nyeri frappe site
    server {
        listen 8001;
        server_name _;

        client_max_body_size 100M;

        ###########################################################
        # React Assets
        ###########################################################
        # location /static/ {
        #     proxy_pass http://nyeri_frontend;

        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        # }

        ###########################################################
        # Frappe Static Assets (Served directly from mounted volume)
        ###########################################################
        location /assets/ {
            # Nginx serves JavaScript and CSS straight out of the shared Docker volume without calling Python/Gunicorn
            alias /home/frappe/frappe-bench/sites/assets/;
            try_files $uri $uri/ =404;
            expires 7d;
            add_header Cache-Control "public, no-transform";
        } 

        ###########################################################
        # Public Uploaded Files (Served directly from mounted volume)
        ###########################################################
        location /files/ {
            alias /home/frappe/frappe-bench/sites/nyeri.site/public/files/;
            try_files $uri $uri/ =404;
        }

        ###########################################################
        # API Routes
        ###########################################################
        location /api/ {
            proxy_pass http://frappe_backend;

            proxy_set_header Host nyeri.site;
            proxy_set_header X-Frappe-Site-Name nyeri.site;
            proxy_set_header X-Forwarded-Host $host;
            # X-Forwarded-Port 8001 added as it ensures Frappe knows it is running behind port 8001 and generates redirect links (e.g., login redirects) correctly
            proxy_set_header X-Forwarded-Port 8001;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            
            # Disable X-Accel-Redirect since edge-proxy handles files directly
            # Gunicorn doesn't try to hand off file serving back to Nginx using internal header redirects
            proxy_set_header X-Use-X-Accel-Redirect False;

            # Pass session cookie explicitly
            proxy_set_header Cookie $http_cookie;
        }

        ###########################################################
        # Frappe Desk / App Routes
        ###########################################################
        location ~ ^/(app|desk|login|logout|oauth|printview|backups) {
            proxy_pass http://frappe_backend;

            proxy_set_header Host nyeri.site;
            proxy_set_header X-Frappe-Site-Name nyeri.site;
            proxy_set_header X-Forwarded-Host $host;
            # X-Forwarded-Port 8001 added as it ensures Frappe knows it is running behind port 8001 and generates redirect links (e.g., login redirects) correctly
            proxy_set_header X-Forwarded-Port 8001;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;

            # Disable X-Accel-Redirect since edge-proxy handles files directly
            # Gunicorn doesn't try to hand off file serving back to Nginx using internal header redirects
            proxy_set_header X-Use-X-Accel-Redirect False;

            # Pass session cookie explicitly
            proxy_set_header Cookie $http_cookie;
        }

        ###########################################################
        # Private Files (Proxied to Gunicorn for permission check)
        ###########################################################
        location /private/ {
            proxy_pass http://frappe_backend;

            proxy_set_header Host nyeri.site;
            proxy_set_header X-Frappe-Site-Name nyeri.site;
            proxy_set_header X-Forwarded-Port 8001;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
        }

        ###########################################################
        # Socket.IO (Realtime Websockets)
        ###########################################################
        location /socket.io {
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host nyeri.site;
            proxy_set_header X-Frappe-Site-Name nyeri.site;

            proxy_pass http://frappe_backend;
        }

        ###########################################################
        # Expo Mobile Web App (Subpath /mobile/)
        ###########################################################
        # Redirect exact /mobile request to /mobile/ to prevent relative path breaks
        # location = /mobile {
        #     return 301 $scheme://$http_host/mobile/;
        # }

        location = /mobile {
            proxy_pass http://nyeri_engage_app/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Handle /mobile/ and every nested Expo route
        location ^~ /mobile/ {
            # The trailing slash strips /mobile/ before proxying.
            proxy_pass http://nyeri_engage_app/;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }

        # # Route all /mobile/* requests cleanly to the Expo app container
        # location /mobile { 
        #     proxy_pass http://nyeri_engage_app;

        #     proxy_http_version 1.1;

        #     proxy_set_header Upgrade $http_upgrade;
        #     proxy_set_header Connection "upgrade";

        #     proxy_set_header Host $host;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Real-IP $remote_addr;
        # }

        # # Handle Expo bundle static assets served under /mobile/_expo/
        # location ^~ /mobile/_expo/ {
        #     proxy_pass http://nyeri_engage_app;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        # }

        
        ###########################################################
        # 1. EXPLICIT ROUTE FOR EXPO STATIC ASSETS & JS BUNDLES
        # Ensures all Expo static bundles, CSS modules, and web assets hit the Expo web container directly
        # Matches /_expo/static/css/..., /_expo/static/js/..., etc.
        ###########################################################
        location ^~ /_expo/ {
            proxy_pass http://nyeri_engage_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
                        
        ###########################################################
        # Default -> React SPA
        ###########################################################
        location / {
            # proxy_pass http://nyeri_frontend;
            proxy_pass http://nyeri_engage_app;

            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

